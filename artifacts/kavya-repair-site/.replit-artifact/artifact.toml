kind = "web"
previewPath = "/"
title = "Kavya Technologies"
description = "A premium, performance-aware website for Kavya Technologies in Kopargaon, helping local customers understand laptop and computer repair services, contact the shop, and request help."
version = "1.0.0"
id = "artifacts/kavya-repair-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24603

[services.development]
run = "pnpm --filter @workspace/kavya-repair-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kavya-repair-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/kavya-repair-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24603"
BASE_PATH = "/"
